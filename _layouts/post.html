<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>{{ page.title }} · {{ site.title | default: "Galaxy 981" }}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <style>
    :root{
      --neon-blue:#00e5ff; --neon-green:#39ff14; --neon-yellow:#ffff33; --neon-purple:#8f00ff;
      --ink:#00ffea; --panel-bg:rgba(0,0,0,0.78); --sidebar-a:#0d0022; --sidebar-b:#12002e; --marquee-bg:#001a4d;
    }
    html, body{
      margin:0; padding:0;
      background-image:url({{ '/stars.gif' | relative_url }}); background-repeat:repeat;
      color:var(--ink); font-family:"Comic Sans MS","Courier New","MS Sans Serif",monospace;
      image-rendering:pixelated; cursor:crosshair; filter:contrast(115%) saturate(125%);
    }

    /* wider than index */
    .page{
      width:min(1120px, calc(100vw - 24px)) !important;
      margin:18px auto 32px; position:relative; left:7px;
      border:6px ridge var(--neon-blue); outline:4px solid #00131a; background:var(--panel-bg);
      box-shadow:0 0 40px var(--neon-blue), inset 0 0 6px #000;
    }

    #glitter-title{
      font-size:60px; text-align:center; color:var(--neon-blue);
      text-shadow:0 0 6px #fff,0 0 10px var(--neon-blue),0 0 14px var(--neon-green);
      margin:0; padding:18px 10px 0; letter-spacing:.5px; position:relative;
    }
    #glitter-title::before,#glitter-title::after{
      content:""; position:absolute; top:50%; transform:translateY(-50%);
      width:110px; height:70px; background-repeat:no-repeat; background-position:center; background-size:contain;
      image-rendering:pixelated; filter:drop-shadow(0 0 6px var(--neon-blue)); pointer-events:none;
    }
    #glitter-title::before{ left:35px;  background-image:url({{ '/starwar1.gif?v=1' | relative_url }}); }
    #glitter-title::after { right:30px; background-image:url({{ '/starwar2.jpg?v=1' | relative_url }}); }
    #glitter-title:hover::before{ transform:translateY(-50%) rotate(-3deg); }
    #glitter-title:hover::after { transform:translateY(-50%) rotate(3deg); }

    .marquee-wrap{ margin:10px 20px; border:6px groove var(--neon-blue); background:var(--marquee-bg); }
    .marquee-wrap.small{ margin:6px 20px 14px; border-width:4px; }
    marquee{ color:var(--neon-yellow); font-weight:bold; font-size:18px; }

    .layout{ width:100%; border-collapse:collapse; }
    .sidebar{
      width:210px;
      background:repeating-linear-gradient(135deg, var(--sidebar-a) 0 12px, var(--sidebar-b) 12px 24px);
      border-right:6px ridge var(--neon-purple); vertical-align:top;
    }
    .content{ padding:10px 14px 20px; vertical-align:top; background:rgba(15,0,20,0.45); border-left:4px solid #21003a; }

    .nav a{
      display:block; margin:10px 6px; padding:6px 8px; border:3px outset #6af7ff; background:#0e0e33; color:#a7ffff;
      text-decoration:none; text-align:left; text-transform:uppercase; text-shadow:0 0 4px var(--neon-blue); box-shadow:2px 2px 0 #000;
    }
    .nav a:hover{ border-style:inset; color:var(--neon-green); background:#140043; transform:translate(1px,1px); }
    .nav-icon{ vertical-align:middle; width:26px; height:26px; margin-right:6px; image-rendering:pixelated; }

    .post{
      margin:14px 0 28px; padding:10px 10px 14px; border:4px groove var(--neon-purple); background:rgba(20,0,30,0.62);
      line-height:1.85;
    }
    .post h1,.post h2,.post h3{ color:var(--neon-purple); text-shadow:0 0 6px var(--neon-purple); margin-top:0; }
    .post .meta{ font-size:12px; color:var(--neon-yellow); margin-bottom:10px; }

    /* embeds & media */
    .post img{ max-width:100%; height:auto; }
    .post a > img{ display:block; margin:12px auto; }   /* makes linked images visible and centered */
    .post pre,.post code{ background:#0e0e33; color:#a7ffff; padding:2px 4px; }
    .post iframe,.post embed,.post object{ width:100%; max-width:100%; border:0; }
    .post iframe[src*="substack.com"]{ min-height:420px; }
    .post blockquote.twitter-tweet{ margin:1em auto; display:block !important; visibility:visible !important; }

    hr.retro{
      height:12px; border:0; margin:10px 0 14px;
      background-image:repeating-linear-gradient(90deg,#ff0000 0 14px,#ffa500 14px 28px,#ffff00 28px 42px,#00cc00 42px 56px,#00aaff 56px 70px,#0000ff 70px 84px,#8000ff 84px 98px);
      position:relative; overflow:visible;
    }
    .content > hr.retro:first-of-type{ position:relative; overflow:visible; }
    .content > hr.retro:first-of-type::after{
      content:""; position:absolute; left:-64px; top:-60px; width:160px; height:160px;
      background:url({{ '/kitty.gif?v=10' | relative_url }}) center/contain no-repeat;
      image-rendering:pixelated; animation:kitty-rail 12s linear infinite; pointer-events:none; z-index:9;
    }
    @keyframes kitty-rail{ from{left:-64px} to{left:100%} }

    .blink{ animation:blink .9s steps(1,end) infinite; } @keyframes blink{ 50%{ opacity:0 } }

    .button-strip{ margin:8px 20px 12px; padding:10px; border:4px groove var(--neon-blue);
      background:rgba(10,0,25,0.6); display:flex; flex-wrap:wrap; gap:10px 12px; justify-content:center; align-items:center; }
    .button-strip img{ height:31px; image-rendering:pixelated; display:block; }

    .sticker-wall{ margin:10px 8px 14px; padding:8px; border:3px inset #6af7ff; background:rgba(0,0,0,0.35);
      display:grid; grid-template-columns:repeat(2,1fr); gap:8px; justify-items:center; align-items:center; position:relative; }
    .sticker-wall img{ width:88px; height:auto; image-rendering:pixelated; display:block; transition:transform 120ms ease; }
    .sticker-wall img:hover{ transform:translateY(-1px); filter:drop-shadow(0 0 6px var(--neon-green)); }
    .sticker-wall .wide{ grid-column:span 2; width:188px; }

    .sticker-controls{ display:flex; gap:8px; justify-content:center; margin:6px 0 10px; }
    .sticker-controls button{ padding:6px 10px; border:2px outset #6af7ff; background:#0e0e33; color:#a7ffff; font-family:inherit; cursor:pointer; box-shadow:2px 2px 0 #000; }
    .sticker-controls button:active{ border-style:inset; color:var(--neon-green); }
    .sticker-wall.shuffled img{ animation:pop 180ms; } @keyframes pop{ 50%{ transform:scale(1.08) } }

    .footer{ padding:8px; text-align:center; color:#fff; }

    .sound-toggle{ margin:6px auto 12px; display:block; background:#0e0e33; color:#a7ffff;
      border:2px outset #6af7ff; padding:6px 10px; font-family:inherit; cursor:pointer; box-shadow:2px 2px 0 #000; }
    .sound-toggle[aria-pressed="true"]{ border-style:inset; color:var(--neon-green); }

    @keyframes flybyL{ 0%{transform:translate(-120%, -10px) rotate(8deg)} 70%{transform:translate(10%, 4px) rotate(-6deg)} 100%{transform:none} }
    @keyframes flybyR{ 0%{transform:translate(120%, 10px) rotate(-8deg)} 70%{transform:translate(-10%, -6px) rotate(6deg)} 100%{transform:none} }
    .flyby #glitter-title::before{ animation:flybyL 1.6s ease-out; } .flyby #glitter-title::after{ animation:flybyR 1.6s ease-out; }

    :root.morning{ --neon-blue:#00e5ff; --neon-purple:#00b2ff; } :root.night{ --neon-blue:#39a0ff; --neon-purple:#8f00ff; }

    .post p{ margin:0 0 14px; } .post ul,.post ol{ padding-left:20px; }
    .post blockquote{ margin:10px 0; padding:8px 12px; border-left:4px solid var(--neon-blue); background:rgba(0,0,0,0.35); }
  
  /* === RESPONSIVE + ACCESSIBILITY TWEAKS === */

/* fluid title size */
#glitter-title{
  font-size: clamp(28px, 7vw, 60px);
  padding: clamp(12px, 3vw, 18px) 10px 0;
}

/* keep code and long lines from overflowing */
.post pre,
.post code{
  white-space: pre-wrap;
  word-wrap: break-word;
  overflow-wrap: anywhere;
}

/* phone and small tablets */
@media (max-width: 900px){
  /* container */
  .page{
    width: min(960px, 100% - 12px) !important;
    margin: 10px auto 20px;
    left: 0;
  }

  /* stack the table layout */
  .layout,
  .layout tr,
  .layout td{
    display: block;
    width: 100%;
  }

  /* sidebar becomes a top band */
  .sidebar{
    width: 100%;
    border-right: 0;
    border-bottom: 6px ridge var(--neon-purple);
  }
  .content{ border-left: 0; }

  /* nav becomes a grid of big tap targets */
  .nav{
    display: grid;
    grid-template-columns: repeat(2, minmax(0,1fr));
    gap: 8px;
  }
  .nav a{
    margin: 0;
    padding: 10px;
    font-size: 14px;
    line-height: 1.2;
    touch-action: manipulation;
  }
  .nav-icon{ width: 22px; height: 22px; }

  /* headline decorations shrink */
  #glitter-title::before,
  #glitter-title::after{
    width: 76px; height: 48px;
    filter: drop-shadow(0 0 4px var(--neon-blue));
    left: 16px; right: 16px;
  }

  /* tighten chrome */
  .marquee-wrap{ margin: 8px 10px; border-width: 4px; }
  .marquee-wrap.small{ margin: 6px 10px 10px; border-width: 3px; }

  /* posts and embeds */
  .post{ margin: 10px 0 20px; padding: 8px 8px 12px; }
  .post iframe,
  .post embed,
  .post object{ height: auto; }
  .post iframe[src*="substack.com"]{ min-height: 340px; }

  /* sticker grid and buttons */
  .sticker-wall{ grid-template-columns: repeat(3, 1fr); }
  .sticker-wall img{ width: 72px; }
  .sticker-wall .wide{ grid-column: span 3; width: 160px; }

  .button-strip{
    padding: 8px;
    gap: 10px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }
  .button-strip img{ height: 28px; flex: 0 0 auto; }

  /* the rail cat can sit out on small screens */
  .content > hr.retro:first-of-type::after{ display: none; }
}

/* very small phones */
@media (max-width: 600px){
  .nav{ grid-template-columns: 1fr; }
  #glitter-title{ font-size: clamp(24px, 9vw, 40px); }
  #glitter-title::before,
  #glitter-title::after{ display: none; }
  marquee{ font-size: 16px; }

  .sticker-wall{ grid-template-columns: repeat(2, 1fr); }
  .sticker-wall img{ width: 64px; }
  .sticker-wall .wide{ grid-column: span 2; width: 140px; }
}

/* tiniest screens */
@media (max-width: 380px){
  .button-strip img{ height: 24px; }
  marquee{ font-size: 14px; }
}

/* reduce motion for folks who prefer it */
@media (prefers-reduced-motion: reduce){
  *{ animation: none !important; transition: none !important; }
}



/* 1) Put stars on their own layer on mobile, remove root filter */
@media (max-width: 900px){
  html, body{
    background: none;
    filter: none;
  }
  body::before{
    content:"";
    position: fixed; inset: 0; z-index: -1; pointer-events: none;
    background: url({{ '/stars.gif' | relative_url }}) repeat;
    image-rendering: pixelated;
    transform: translateZ(0); /* own composited layer */
    will-change: transform;
  }
  /* keep the neon pop ONLY on content */
  .page{ filter: contrast(115%) saturate(125%); }
}

/* 2) Make big images cheap to paint and prevent layout jumps */
.post img{
  display:block;
  max-width:100%;
  height:auto;
  image-rendering:auto;           /* override any pixelation on images */
}

/* Mobile-only extra guards */
@media (max-width: 900px){
  .post img{
    content-visibility: auto;     /* skip offscreen work */
    contain-intrinsic-size: 800px auto; /* placeholder to avoid reflow while decoding */
    transform: translateZ(0);     /* isolate while scrolling */
    backface-visibility: hidden;
  }
}

/* Motion preference: swap animated bg for a still frame if available */
@media (prefers-reduced-motion: reduce){
  body::before{ background-image: url({{ '/stars-still.png' | relative_url }}); }
}

    /* 1) Never let long links/words force a mega-wide layout */
.post p,
.post li,
.post blockquote {
  overflow-wrap: anywhere;
  word-break: break-word;
  hyphens: auto;
}
.post a,
.post code,
.post pre {
  word-break: break-all;     /* URLs and long tokens */
  overflow-wrap: anywhere;
}

/* 2) Treat touch devices as “mobile” regardless of zoom level */
@media (max-width: 900px), (hover: none) and (pointer: coarse){
  .layout,
  .layout tr,
  .layout td { display: block; width: 100%; }  /* always stacked on phones */
}

/* 3) Make the table layout more resilient to wide content */
.layout { table-layout: fixed; width: 100%; }
.sidebar { width: 210px; }         /* fixed first column width hint */
.content { width: auto; min-width: 0; }  /* allow wrapping inside */


/* ============================================================
   READING MODE  ·  replace your old "READING MODE OVERRIDES"
   block with everything below (keep it last in the <style> tag)
   ============================================================ */

/* Optional web font. Delete this line if you only want locally
   installed faces; the stack below falls back gracefully. */
@import url('https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap');

:root{
  --read-bg:#fffdf7;          /* warm off-white, not full parchment */
  --read-ink:#1c1b19;
  --read-muted:#6b6560;
  --read-rule:#e3dccd;
  --read-link:#3a2fa8;
  --read-link-visited:#6a0dad;
  --read-accent:#5b008a;
  --read-measure:680px;       /* the reading column width */
}

/* Keep the global neon filter off the article, but let the retro
   chrome stay as loud as it was. */
html, body{ filter:none; }
.marquee-wrap, .button-strip, .sticker-wall, #glitter-title,
.sidebar, .footer, .sound-toggle{ filter:contrast(115%) saturate(125%); }

/* ---------- the article container ---------- */
.post{
  max-width:var(--read-measure);
  margin:20px auto 30px;
  padding:36px 40px 42px;
  background:var(--read-bg);
  color:var(--read-ink);
  border:3px solid var(--neon-purple);
  box-shadow:0 0 22px rgba(143,0,255,.35);

  font-family:"EB Garamond", Baskerville, "Libre Baskerville",
              Garamond, "Hoefler Text", "Palatino Linotype",
              Palatino, Georgia, serif;
  font-size:21px;
  line-height:1.62;
  letter-spacing:.005em;
  font-kerning:normal;
  font-variant-numeric:oldstyle-nums;
  text-rendering:optimizeLegibility;
  -webkit-font-smoothing:antialiased;
}

/* ---------- body copy ---------- */
.post p,
.post li,
.post blockquote,
.post section{ color:var(--read-ink); }

.post p{ margin:0 0 1.15em; }
.post section > p:first-child{ margin-top:0; }

/* ---------- headings ---------- */
.post h1, .post h2, .post h3, .post h4{
  font-family:inherit;
  color:var(--read-accent);
  text-shadow:none;
  font-weight:600;
  line-height:1.18;
  letter-spacing:-.01em;
}
.post h1{ font-size:2.05em; margin:0 0 .3em; }
.post h2{ font-size:1.48em; margin:1.6em 0 .4em; }
.post h3{ font-size:1.2em;  margin:1.4em 0 .35em; }
.post h4{ font-size:1.02em; margin:1.3em 0 .3em; text-transform:uppercase;
          letter-spacing:.06em; }

/* ---------- byline / date ---------- */
.post .meta{
  font-family:Verdana, "Helvetica Neue", Arial, sans-serif;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.09em;
  color:var(--read-muted);
  padding-bottom:14px;
  margin-bottom:24px;
  border-bottom:1px solid var(--read-rule);
}

/* ---------- links ---------- */
.post a{
  color:var(--read-link);
  text-decoration:underline;
  text-underline-offset:2px;
  text-decoration-thickness:1px;
  word-break:normal;            /* cancels the earlier break-all rule */
  overflow-wrap:anywhere;
}
.post a:visited{ color:var(--read-link-visited); }
.post a:hover{ color:#cc0066; background:#fff2b8; }

/* ---------- lists, quotes, rules ---------- */
.post ul, .post ol{ margin:0 0 1.15em; padding-left:1.4em; }
.post li{ margin:0 0 .45em; }

.post blockquote{
  margin:1.5em 0;
  padding:.15em 0 .15em 1.1em;
  border-left:3px solid var(--read-accent);
  background:none;
  color:var(--read-muted);
  font-style:italic;
}

.post hr{
  border:0; height:1px; width:62%;
  background:var(--read-rule);
  margin:2.2em auto;
}

/* ---------- media ---------- */
.post img{
  display:block;
  margin:1.7em auto;
  max-width:100%;
  height:auto;
  border:1px solid var(--read-rule);
  image-rendering:auto;
}
.post a > img{ margin:1.7em auto; }

.post figure{ margin:1.7em 0; }
.post figcaption, .post .caption{
  font-family:Verdana, Arial, sans-serif;
  font-size:12px;
  line-height:1.5;
  color:var(--read-muted);
  text-align:center;
  margin-top:-1.1em;
}

.post iframe, .post embed, .post object{ margin:1.5em 0; }
.post blockquote.twitter-tweet{
  border-left:0; padding:0; font-style:normal; margin:1.5em auto;
}

/* ---------- code ---------- */
.post pre, .post code{
  font-family:"Courier New", monospace;
  font-size:.8em;
  font-variant-numeric:normal;
  background:#f3ece0;
  color:#1a1a1a;
  border:1px solid #ded4c0;
}
.post pre{ padding:12px 14px; line-height:1.5; overflow-x:auto;
           white-space:pre-wrap; overflow-wrap:anywhere; }
.post code{ padding:1px 5px; }
.post pre code{ background:none; border:0; padding:0; }

/* ---------- optional: drop cap on the first paragraph ----------
.post section > p:first-child::first-letter{
  float:left; font-size:3.1em; line-height:.82;
  margin:.06em .09em 0 0; color:var(--read-accent);
}
---------------------------------------------------------------- */

/* ---------- small screens ---------- */
@media (max-width:900px){
  .post{ font-size:19px; padding:24px 22px 28px; margin:12px auto 20px; }
}
@media (max-width:600px){
  .post{ font-size:18px; padding:18px 16px 22px; border-width:2px;
         line-height:1.58; }
  .post h1{ font-size:1.68em; }
  .post h2{ font-size:1.32em; }
}
</style>
</body>
</html>
