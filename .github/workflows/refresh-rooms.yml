# Keeps rooms.json stocked for liminal.html.
#
# The page needs a list of photographs from r/LiminalSpace, and reddit is
# easier to reach from a runner than from a browser, so the crawl happens
# here and the result is committed. Run it by hand from the Actions tab the
# first time; after that it refreshes itself on Mondays.
name: refresh liminal rooms

on:
  workflow_dispatch:
    inputs:
      args:
        description: 'arguments for tools/fetch_rooms.py'
        default: '--limit 250'
        required: false
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Anonymous requests are refused from Actions runners, which sit in a
      # datacentre. Add REDDIT_CLIENT_ID and REDDIT_CLIENT_SECRET as repo
      # secrets (a "script" app at reddit.com/prefs/apps) and the crawl
      # authenticates instead.
      # ARGS goes through the environment rather than straight into the
      # shell line, which is the documented way to keep a dispatch input
      # from being read as script.
      - name: collect rooms
        env:
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}
          ARGS: ${{ inputs.args || '--limit 250' }}
        run: python3 tools/fetch_rooms.py $ARGS

      - name: commit if anything changed
        run: |
          if git diff --quiet -- rooms.json; then
            echo "rooms.json unchanged"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rooms.json
          git commit -m "Refresh liminal rooms from r/LiminalSpace"
          git push
