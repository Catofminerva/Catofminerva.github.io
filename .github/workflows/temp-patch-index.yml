name: Temporary index background patch

on:
  push:
    paths:
      - '.github/workflows/temp-patch-index.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python {0}
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  </style>'
          tag = 'cyber-gif-bg-patch-2026-08-31'

          css = r'''

/* cyber-gif-bg-patch-2026-08-31
   Keep BACK1.jpg everywhere else, but cover the title area and Zaki card
   with the Welcome to Cyber Space GIF. The original banner and kirbys stay. */
#glitter-title{
  background-image: url("welcometocyber.gif") !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
}

td.content .post:has(.pet-row){
  background-image: url("welcometocyber.gif") !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
}
'''

          if tag not in text:
              if marker not in text:
                  raise SystemExit('Could not find closing </style> marker')
              text = text.replace(marker, css + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use cyber GIF behind header and Zaki"
          git push
