name: Temporary index background patch

on:
  push:
    paths:
      - '.github/workflows/temp-patch-index.yml'

permissions:
  contents: write

jobs:
  patch-index:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch index.html
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          marker = '  </style>'
          tag = 'zaki-bg-patch-2026-08-31'

          css = r'''

/* zaki-bg-patch-2026-08-31
   Use Zaki's animated landscape as the local backdrop for the cyber header
   and the whole pet card. BACK1.jpg remains untouched everywhere else. */
#glitter-title{
  background-image: url("https://media.giphy.com/media/FlodpfQUBSp20/giphy.gif") !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
}

td.content .post:has(.pet-row){
  background-image: url("https://media.giphy.com/media/FlodpfQUBSp20/giphy.gif") !important;
  background-position: center center !important;
  background-size: cover !important;
  background-repeat: no-repeat !important;
}

td.content .post:has(.pet-row) > h3,
td.content .post:has(.pet-row) > .meta,
td.content .post:has(.pet-row) .pet-sidekick-cap{
  color: #fff !important;
  text-shadow: 1px 1px 0 #000, -1px -1px 0 #000, 0 0 5px #000 !important;
}
'''

          if tag not in text:
              if marker not in text:
                  raise SystemExit('Could not find closing </style> marker')
              text = text.replace(marker, css + '\n' + marker, 1)
              path.write_text(text, encoding='utf-8')

      - name: Commit patch
        run: |
          if git diff --quiet -- index.html; then
            echo "No change needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use Zaki GIF as header and pet background"
          git push
